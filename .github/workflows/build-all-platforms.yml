name: Build All Platforms

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: build-all-platforms-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CSC_IDENTITY_AUTO_DISCOVERY: false

jobs:
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          PKG=$(node -p "require('./package.json').version")
          TAG="${GITHUB_REF_NAME#v}"
          if [ "$PKG" != "$TAG" ]; then
            echo "::error::tag v$TAG 与 package.json 版本 $PKG 不一致"
            exit 1
          fi

  build-macos:
    name: Build macOS Universal
    needs: typecheck
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build macOS Universal
        run: pnpm build && pnpm exec electron-builder --mac dmg zip --universal --publish never

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dex-buddy-macos-universal
          path: |
            release/*.dmg
            release/*-mac.zip
            release/*.zip
            release/latest-mac.yml
            release/*.blockmap
          if-no-files-found: error
          retention-days: 14

  build-windows:
    name: Build Windows x64
    needs: typecheck
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Windows x64
        run: pnpm build && pnpm exec electron-builder --win --x64 --publish never

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dex-buddy-windows-x64
          path: |
            release/*.exe
            release/latest*.yml
            release/*.blockmap
          if-no-files-found: error
          retention-days: 14

  build-linux:
    name: Build Linux x64
    needs: typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Linux packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm fakeroot dpkg

      - name: Build Linux x64
        # AppImage + deb；snap 需额外 snapcraft，CI 上易失败，先不产出
        run: pnpm build && pnpm exec electron-builder --linux AppImage deb --x64 --publish never

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dex-buddy-linux-x64
          path: |
            release/*.AppImage
            release/*.deb
            release/latest*.yml
            release/*.blockmap
          if-no-files-found: error
          retention-days: 14

  publish-runtimes:
    name: Publish runtimes to Qiniu
    # 打 tag 和手动跑都执行。文件很少变，脚本按 hash 跳过已有对象。
    needs: typecheck
    runs-on: ubuntu-latest
    env:
      QINIU_ACCESS_KEY: ${{ secrets.QINIU_ACCESS_KEY }}
      QINIU_SECRET_KEY: ${{ secrets.QINIU_SECRET_KEY }}
      QINIU_BUCKET: ${{ secrets.QINIU_BUCKET }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install qshell
        run: |
          curl -fsSL -o /tmp/qshell.tar.gz \
            https://github.com/qiniu/qshell/releases/download/v2.19.9/qshell-v2.19.9-linux-amd64.tar.gz
          tar -xzf /tmp/qshell.tar.gz -C /tmp
          install -m 755 /tmp/qshell /usr/local/bin/qshell
          qshell -v

      - name: Upload uv, Python and Node
        run: node --experimental-strip-types scripts/publish-runtimes.ts

  release:
    name: Publish GitHub Release
    needs: [build-macos, build-windows, build-linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      QINIU_ACCESS_KEY: ${{ secrets.QINIU_ACCESS_KEY }}
      QINIU_SECRET_KEY: ${{ secrets.QINIU_SECRET_KEY }}
      QINIU_BUCKET: ${{ secrets.QINIU_BUCKET }}
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-assets/**/*.dmg
            release-assets/**/*.exe
            release-assets/**/*.AppImage
            release-assets/**/*.deb
            release-assets/**/*-mac.zip
            release-assets/**/latest*.yml
            release-assets/**/*.blockmap

      - name: Install qshell
        run: |
          curl -fsSL -o /tmp/qshell.tar.gz \
            https://github.com/qiniu/qshell/releases/download/v2.19.9/qshell-v2.19.9-linux-amd64.tar.gz
          tar -xzf /tmp/qshell.tar.gz -C /tmp
          install -m 755 /tmp/qshell /usr/local/bin/qshell
          qshell -v

      - name: Upload update files to Qiniu
        run: |
          set -euo pipefail
          win="release-assets/dex-buddy-windows-x64"
          mac="release-assets/dex-buddy-macos-universal"
          mkdir -p qiniu-upload
          cp "$win/latest.yml" "$win"/*.exe "$win"/*.blockmap qiniu-upload/
          cp "$mac/latest-mac.yml" "$mac"/*.dmg "$mac"/*-mac.zip "$mac"/*.blockmap qiniu-upload/
          qshell account --overwrite -- "$QINIU_ACCESS_KEY" "$QINIU_SECRET_KEY" dex-buddy
          for file in qiniu-upload/*; do
            name="$(basename "$file")"
            qshell rput --overwrite "$QINIU_BUCKET" "dex-buddy/$name" "$file"
          done
          printf '%s\n' \
            'https://oss.ai.66plat.com/dex-buddy/latest.yml' \
            'https://oss.ai.66plat.com/dex-buddy/latest-mac.yml' \
            > /tmp/qiniu-refresh.txt
          qshell cdnrefresh -i /tmp/qiniu-refresh.txt
