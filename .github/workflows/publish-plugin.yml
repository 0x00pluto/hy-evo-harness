name: Publish Plugin

on:
  workflow_dispatch:
    inputs:
      repository:
        description: 插件仓库，形如 owner/name
        required: true
        type: string
      tag:
        description: 版本 tag，形如 v1.2.0，须与 plugin.manifest.json 的 version 一致
        required: true
        type: string
  workflow_call:
    inputs:
      repository:
        description: 插件仓库，形如 owner/name
        required: true
        type: string
      tag:
        description: 版本 tag，形如 v1.2.0
        required: true
        type: string

# 合成目录必须串行。两个插件同时发布时，后一次要看见先一次已经上传的版本说明。
concurrency:
  group: plugin-catalog
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      repository: ${{ steps.plugin.outputs.repository }}
      tag: ${{ steps.plugin.outputs.tag }}
    env:
      RAW_REPOSITORY: ${{ inputs.repository }}
      RAW_TAG: ${{ inputs.tag }}
    steps:
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check out Dex Buddy
        uses: actions/checkout@v4
        with:
          path: harness

      - name: Resolve plugin repository
        id: plugin
        working-directory: harness
        run: |
          set -euo pipefail
          node --experimental-strip-types scripts/resolve-plugin-source.ts

      - name: Check out plugin
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.plugin.outputs.repository }}
          ref: ${{ steps.plugin.outputs.tag }}
          path: plugin-src
          token: ${{ secrets.PLUGIN_CHECKOUT_TOKEN || github.token }}

      - name: Reject binary pack file
        working-directory: harness
        run: |
          set -euo pipefail
          node --experimental-strip-types scripts/read-plugin-publish.ts \
            --dir "$GITHUB_WORKSPACE/plugin-src"

  publish:
    needs: detect
    if: needs.detect.result == 'success'
    runs-on: ubuntu-latest
    env:
      QINIU_ACCESS_KEY: ${{ secrets.QINIU_ACCESS_KEY }}
      QINIU_SECRET_KEY: ${{ secrets.QINIU_SECRET_KEY }}
      QINIU_BUCKET: ${{ secrets.QINIU_BUCKET }}
      RAW_TAG: ${{ needs.detect.outputs.tag }}
    steps:
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check out Dex Buddy
        uses: actions/checkout@v4
        with:
          path: harness

      - name: Check out plugin
        uses: actions/checkout@v4
        with:
          repository: ${{ needs.detect.outputs.repository }}
          ref: ${{ needs.detect.outputs.tag }}
          path: plugin-src
          token: ${{ secrets.PLUGIN_CHECKOUT_TOKEN || github.token }}

      - name: Pack plugin
        working-directory: harness
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq zip
          node --experimental-strip-types scripts/pack-plugin.ts \
            --dir "$GITHUB_WORKSPACE/plugin-src" \
            --tag "$RAW_TAG" \
            --out-dir "$GITHUB_WORKSPACE/plugin-release"

      - name: Install qshell
        run: |
          curl -fsSL -o /tmp/qshell.tar.gz \
            https://github.com/qiniu/qshell/releases/download/v2.19.9/qshell-v2.19.9-linux-amd64.tar.gz
          tar -xzf /tmp/qshell.tar.gz -C /tmp
          install -m 755 /tmp/qshell /usr/local/bin/qshell
          qshell -v

      - name: Upload release and rebuild catalog
        working-directory: harness
        run: |
          set -euo pipefail
          qshell account --overwrite -- "$QINIU_ACCESS_KEY" "$QINIU_SECRET_KEY" dex-buddy
          json="$(find "$GITHUB_WORKSPACE/plugin-release" -name '*.json' -print -quit)"
          zip="$(find "$GITHUB_WORKSPACE/plugin-release" -name '*.zip' -print -quit)"
          meta="$(node --input-type=module -e 'import fs from "node:fs"; const release = JSON.parse(fs.readFileSync(process.argv[1], "utf8")); process.stdout.write(release.id + "\n" + release.version + "\n");' "$json")"
          plugin_id="$(printf '%s\n' "$meta" | sed -n '1p')"
          version="$(printf '%s\n' "$meta" | sed -n '2p')"
          prefix="dex-buddy/plugins/${plugin_id}/${version}"
          qshell rput --overwrite "$QINIU_BUCKET" "${prefix}.zip" "$zip"
          qshell rput --overwrite "$QINIU_BUCKET" "${prefix}.json" "$json"
          mkdir -p "/tmp/plugin-versions/dex-buddy/plugins/${plugin_id}"
          cp "$json" "/tmp/plugin-versions/${prefix}.json"
          qshell listbucket --prefix "dex-buddy/plugins/" "$QINIU_BUCKET" -o /tmp/plugin-keys.txt || true
          while IFS= read -r key; do
            [ -n "$key" ] || continue
            dest="/tmp/plugin-versions/${key}"
            mkdir -p "$(dirname "$dest")"
            qshell get "$QINIU_BUCKET" "$key" -o "$dest"
          done < <(node --experimental-strip-types scripts/filter-release-keys.ts /tmp/plugin-keys.txt)
          node --experimental-strip-types scripts/build-plugin-index.ts \
            --dir /tmp/plugin-versions \
            --out /tmp/plugin-index.json
          qshell rput --overwrite "$QINIU_BUCKET" "dex-buddy/plugins/index.json" /tmp/plugin-index.json
          printf '%s\n' \
            "https://oss.ai.66plat.com/${prefix}.zip" \
            "https://oss.ai.66plat.com/${prefix}.json" \
            'https://oss.ai.66plat.com/dex-buddy/plugins/index.json' \
            > /tmp/qiniu-refresh.txt
          qshell cdnrefresh -i /tmp/qiniu-refresh.txt
