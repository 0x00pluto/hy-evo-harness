<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>AI 漫剧大师</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #171717;
      --muted: #6b6b6b;
      --paper: #ffffff;
      --line: #ececec;
      --hover: #f3f3f3;
    }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
      background: var(--paper);
      color: var(--ink);
    }
    main {
      max-width: 640px;
      margin: 0 auto;
      padding: 48px 24px;
    }
    h1 {
      font-weight: 600;
      margin: 0 0 8px;
    }
    p { color: var(--muted); }
    label { display: block; font-size: 14px; margin-bottom: 8px; }
    textarea {
      width: 100%;
      min-height: 96px;
      box-sizing: border-box;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px;
      font: inherit;
      background: var(--paper);
      color: var(--ink);
    }
    button {
      margin-top: 12px;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 10px 16px;
      background: var(--hover);
      color: var(--ink);
      font: inherit;
      cursor: pointer;
    }
    pre {
      margin-top: 18px;
      padding: 14px;
      border-radius: 12px;
      background: var(--paper);
      border: 1px solid var(--line);
      color: var(--ink);
      white-space: pre-wrap;
      word-break: break-word;
    }
  </style>
</head>
<body>
  <main>
    <h1>AI 漫剧大师创作台</h1>
    <p>通过宿主服务生成，不占用本地端口。</p>
    <label for="prompt">提示词</label>
    <textarea id="prompt">古风修仙场景</textarea>
    <button id="btn" type="button">生成漫剧</button>
    <pre id="result">等待生成</pre>
  </main>
  <script>
    const result = document.getElementById('result');
    document.getElementById('btn').onclick = async () => {
      const prompt = document.getElementById('prompt').value;
      result.textContent = '正在生成…';
      try {
        const payload = await window.dex.call('aiComicService', 'renderVideo', [{ prompt }]);
        result.textContent = JSON.stringify(payload, null, 2);
      } catch (err) {
        result.textContent = err && err.message ? err.message : '生成失败';
      }
    };
  </script>
</body>
</html>
