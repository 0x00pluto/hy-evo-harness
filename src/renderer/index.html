<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Dex Buddy</title>
  <script>
    if (/Mac/i.test(navigator.platform)) document.documentElement.classList.add('is-mac');
  </script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="boot" aria-hidden="true">
    <img src="logo.svg" alt="">
  </div>
  <div id="titlebar"></div>
  <div id="shell">
  <aside id="sidebar">
    <div class="brand">
      <img class="brand-mark" src="logo.svg" alt="">
      <div>
        <div class="brand-name">Dex Buddy</div>
        <div class="brand-sub">统一工作台</div>
      </div>
    </div>
    <div id="plugin-pane">
      <div class="section-title">应用与工具</div>
      <nav id="plugin-nav" aria-label="插件列表"></nav>
    </div>
    <div id="settings-nav" hidden>
      <button id="settings-back" class="nav-item" type="button">返回</button>
      <h2 id="settings-heading">设置</h2>
      <input id="settings-search" type="search" placeholder="搜索" aria-label="搜索设置" autocomplete="off">
      <div class="section-title">插件</div>
      <div id="settings-list"></div>
    </div>
    <div id="sidebar-actions">
    <button id="install-btn" type="button">
      <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
        <path d="M8 3.25v9.5M3.25 8h9.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      安装插件
    </button>
    <button id="settings-btn" type="button">
      <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
        <circle cx="8" cy="8" r="2.2" fill="none" stroke="currentColor" stroke-width="1.5"/>
        <path d="M8 1.8v1.5M8 12.7v1.5M1.8 8h1.5M12.7 8h1.5M3.5 3.5l1.1 1.1M11.4 11.4l1.1 1.1M12.5 3.5l-1.1 1.1M4.6 11.4l-1.1 1.1" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
      设置
    </button>
    <div id="update-footer" hidden>
      <button id="update-retry" type="button" hidden>重试</button>
      <button id="update-btn" type="button" hidden aria-label="安装更新">
        <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
          <path d="M8 2.5v8.2M4.8 6.2 8 2.8l3.2 3.4" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M3 13.2h10" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
    </div>
  </aside>
  <div
    id="splitter"
    role="separator"
    aria-orientation="vertical"
    aria-label="调整侧栏宽度"
    aria-valuemin="220"
    aria-valuemax="480"
    aria-valuenow="292"
    tabindex="0"
  ></div>

  <main id="main-container">
    <p id="status" role="status"></p>
    <section id="welcome-screen">
      <div class="welcome-card">
        <p class="eyebrow">Huyuan AI</p>
        <h1>欢迎使用统一工作台</h1>
        <p class="lede">从左侧打开应用。后台工具会静默运行。把插件压缩包拖到下方，即可安装并立刻使用。</p>
        <div id="drop-zone" tabindex="0">将 .zip 插件包拖到这里</div>
      </div>
    </section>

    <section id="headless-screen" hidden>
      <div class="welcome-card">
        <p class="eyebrow">后台服务</p>
        <h1 id="headless-title"></h1>
        <p class="lede">该工具没有界面，已在系统后台运行。</p>
        <button id="uninstall-headless" type="button" hidden>卸载此插件</button>
      </div>
    </section>

    <div id="plugin-toolbar" hidden>
      <span id="plugin-title"></span>
      <button id="uninstall-btn" type="button" hidden>卸载</button>
    </div>
    <div id="viewport-host" hidden></div>
    <section id="settings-screen" hidden>
      <h1 id="settings-plugin-title"></h1>
      <p id="settings-schema-error" class="settings-error" hidden></p>
      <div id="settings-form"></div>
      <div id="settings-actions" hidden>
        <button id="settings-save" type="button">保存</button>
      </div>
      <p id="settings-empty" class="settings-empty" hidden></p>
      <div id="settings-entry-host" hidden></div>
    </section>
  </main>
  </div>

  <dialog id="update-dialog">
    <h2 id="update-dialog-title"></h2>
    <p id="update-dialog-body"></p>
    <div class="update-dialog-actions">
      <button id="update-later" type="button">稍后</button>
      <button id="update-confirm" class="primary" type="button">下载新版本</button>
    </div>
  </dialog>

  <script type="module" src="app.js"></script>
</body>
</html>
