<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Dex Buddy</title>
  <script>
    if (/Mac/i.test(navigator.platform)) document.documentElement.classList.add('is-mac');
  </script>
  <link rel="stylesheet" href="style.css">
</head>
<body data-pin="on" data-surface="workspace">
  <div id="boot" aria-hidden="true">
    <img src="logo.svg" alt="">
  </div>
  <div id="titlebar">
    <div class="titlebar-leading">
      <button id="history-back" class="titlebar-btn" type="button" disabled aria-label="后退">
        <i data-lucide="arrow-left"></i>
      </button>
      <button id="history-forward" class="titlebar-btn" type="button" disabled aria-label="前进">
        <i data-lucide="arrow-right"></i>
      </button>
      <button id="sidebar-toggle" class="titlebar-btn" type="button" aria-pressed="false" aria-label="收起侧栏">
        <i data-lucide="panel-left-close"></i>
      </button>
    </div>
    <div id="titlebar-plugin-name"></div>
  </div>
  <div id="shell">
  <nav id="rail" aria-label="图标轨">
    <div class="rail-top">
      <button id="rail-home" class="rail-btn" type="button" aria-label="主页">
        <i data-lucide="house"></i>
      </button>
      <button id="rail-plugins" class="rail-btn" type="button" aria-label="插件">
        <i data-lucide="puzzle"></i>
      </button>
      <button id="rail-ellipsis" class="rail-btn" type="button" aria-label="更多">
        <i data-lucide="ellipsis"></i>
      </button>
      <div class="rail-rule" role="separator"></div>
      <button id="rail-account" class="rail-btn" type="button" aria-label="用户">
        <i data-lucide="circle-user"></i>
      </button>
    </div>
    <div class="rail-bottom">
      <div id="gear-popover" role="menu" hidden>
        <div id="gear-username">本地用户</div>
        <div class="gear-rule" role="separator"></div>
        <button id="update-btn" class="gear-row" type="button" role="menuitem" hidden>
          <i data-lucide="download"></i>
          <span id="update-label" class="gear-label"></span>
        </button>
        <button id="update-retry" class="gear-row" type="button" role="menuitem" hidden>重试</button>
        <button id="gear-open-settings" class="gear-row" type="button" role="menuitem">
          <i data-lucide="settings"></i>
          <span class="gear-label">设置</span>
          <span id="settings-shortcut" class="gear-aside">⌘,</span>
        </button>
        <button id="gear-help" class="gear-row" type="button" role="menuitem">
          <i data-lucide="circle-help"></i>
          <span class="gear-label">帮助</span>
          <i data-lucide="chevron-right" class="gear-aside"></i>
        </button>
      </div>
      <button id="rail-update" class="rail-btn" type="button" aria-label="下载新版本" hidden>
        <i data-lucide="download"></i>
      </button>
      <button id="rail-settings" class="rail-btn" type="button" aria-label="设置" aria-haspopup="menu" aria-expanded="false">
        <i data-lucide="settings"></i>
      </button>
    </div>
  </nav>
  <main id="main-container">
    <aside id="sidebar">
      <div class="brand">
        <img class="brand-mark" src="logo.svg" alt="">
        <div>
          <div class="brand-name">Dex Buddy</div>
          <div class="brand-sub">统一工作台</div>
        </div>
      </div>
      <div id="plugin-pane">
        <div class="section-title">应用与工具</div>
        <nav id="plugin-nav" aria-label="插件列表"></nav>
      </div>
    </aside>
    <div
      id="splitter"
      class="pane-splitter"
      role="separator"
      aria-orientation="vertical"
      aria-label="调整侧栏宽度"
      aria-valuemin="220"
      aria-valuemax="480"
      aria-valuenow="292"
      tabindex="0"
    ></div>
    <div id="workspace-pane">
    <p id="status" role="status"></p>
    <section id="welcome-screen">
      <div class="welcome-card">
        <p class="eyebrow">Huyuan AI</p>
        <h1>欢迎使用统一工作台</h1>
        <p class="lede">从左侧打开应用。后台工具会静默运行。把插件压缩包拖到下方，即可安装并立刻使用。</p>
        <div id="drop-zone" tabindex="0">将 .zip 插件包拖到这里</div>
      </div>
    </section>

    <section id="headless-screen" hidden>
      <div class="welcome-card">
        <p class="eyebrow">后台服务</p>
        <h1 id="headless-title"></h1>
        <p class="lede">该工具没有界面，已在系统后台运行。</p>
      </div>
    </section>

    <div id="viewport-host" hidden></div>
    </div>
    <div id="split-layout" hidden>
      <aside id="split-nav" class="split-nav">
        <div class="split-heading">
          <h2 id="settings-heading" hidden>设置</h2>
          <h2 id="plugins-heading" hidden>插件</h2>
        </div>
        <div class="split-search">
          <input id="settings-search" type="search" placeholder="搜索" aria-label="搜索设置" autocomplete="off" hidden>
          <input id="plugins-search" type="search" placeholder="搜索" aria-label="搜索插件" autocomplete="off" hidden>
        </div>
        <div class="split-section">
          <div id="settings-section" class="section-title" hidden>插件</div>
          <div id="plugins-section" class="section-title" hidden>已安装</div>
        </div>
        <div class="split-list">
          <div id="settings-list" hidden></div>
          <div id="plugins-list" hidden></div>
        </div>
      </aside>
      <div
        id="split-splitter"
        class="pane-splitter"
        role="separator"
        aria-orientation="vertical"
        aria-label="调整导航宽度"
        aria-valuemin="220"
        aria-valuemax="480"
        aria-valuenow="292"
        tabindex="0"
      ></div>
      <div class="split-main">
        <section id="plugins-screen" hidden>
          <p id="plugins-status" role="status"></p>
          <div id="plugins-install">
            <div class="split-main-bar plugins-stage-bar">
              <h1>插件</h1>
              <div class="plugins-stage-actions">
                <button id="plugins-refresh" type="button" aria-label="刷新">
                  <i data-lucide="refresh-cw"></i>
                </button>
                <button id="plugins-add" type="button">
                  <i data-lucide="plus"></i>
                  <span>添加</span>
                </button>
              </div>
            </div>
            <div id="plugins-drop" tabindex="0">
              <i data-lucide="puzzle"></i>
              <p>把插件压缩包拖到这里</p>
              <p class="plugins-drop-hint">或点右上角的添加，选择 .zip</p>
            </div>
          </div>
          <div id="plugins-detail" hidden></div>
        </section>
        <section id="settings-screen" hidden>
          <div class="split-main-bar">
            <h1 id="settings-plugin-title"></h1>
          </div>
          <p id="settings-schema-error" class="settings-error" hidden></p>
          <div id="settings-form"></div>
          <div id="settings-actions" hidden>
            <button id="settings-save" type="button">保存</button>
          </div>
          <p id="settings-empty" class="settings-empty" hidden></p>
          <div id="settings-entry-host" hidden></div>
        </section>
      </div>
    </div>
  </main>
  </div>

  <dialog id="update-dialog">
    <h2 id="update-dialog-title"></h2>
    <p id="update-dialog-body"></p>
    <div class="update-dialog-actions">
      <button id="update-later" type="button">稍后</button>
      <button id="update-confirm" class="primary" type="button">下载新版本</button>
    </div>
    <div id="update-progress" hidden>
      <span id="update-progress-fill"></span>
    </div>
  </dialog>

  <script src="../../node_modules/lucide/dist/umd/lucide.min.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
