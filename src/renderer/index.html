<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Huyuan AI 工作台 Hub</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <aside id="sidebar">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">H</div>
      <div>
        <div class="brand-name">Huyuan Hub</div>
        <div class="brand-sub">统一工作台</div>
      </div>
    </div>
    <div class="section-title">应用与工具</div>
    <nav id="plugin-nav" aria-label="插件列表"></nav>
    <button id="install-btn" type="button">安装插件</button>
  </aside>

  <main id="main-container">
    <p id="status" role="status"></p>
    <section id="welcome-screen">
      <div class="welcome-card">
        <p class="eyebrow">Huyuan AI</p>
        <h1>欢迎使用统一工作台</h1>
        <p class="lede">从左侧打开应用。后台工具会静默运行。把插件压缩包拖到下方，即可安装并立刻使用。</p>
        <div id="drop-zone" tabindex="0">将 .zip 插件包拖到这里</div>
      </div>
    </section>

    <section id="headless-screen" hidden>
      <div class="welcome-card">
        <p class="eyebrow">后台服务</p>
        <h1 id="headless-title"></h1>
        <p class="lede">该工具没有界面，已在系统后台运行。</p>
        <button id="uninstall-headless" type="button" hidden>卸载此插件</button>
      </div>
    </section>

    <div id="plugin-toolbar" hidden>
      <span id="plugin-title"></span>
      <button id="uninstall-btn" type="button" hidden>卸载</button>
    </div>
    <div id="viewport-host" hidden></div>
  </main>

  <script src="app.js"></script>
</body>
</html>
